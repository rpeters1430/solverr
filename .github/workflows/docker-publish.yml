name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*.*", "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.1"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Set up Node for release notes renderer tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Test release notes renderer
        run: node --test tests/test_release_notes_ui.js

      - name: Lint (ruff)
        run: |
          ruff check app/

      - name: Security scan (bandit, non-blocking)
        continue-on-error: true
        run: |
          bandit -r app -ll

  build-and-push:
    name: Build & Push Docker Image (amd64 / UGREEN NASync)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build versioned release notes
        id: release-notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          mode: COMMIT
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Other changes", "labels": [] }
              ],
              "label_extractor": [
                { "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)", "on_property": "title", "target": "$1" }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed changelog and image revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANGELOG: ${{ steps.release-notes.outputs.changelog }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -eu
          if [ -n "$TAG_NAME" ]; then
            VERSION="${TAG_NAME#v}"
            NOTES="$RELEASE_CHANGELOG"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            VERSION="build-${GITHUB_SHA::12}"
            NOTES=$(git log --format='- %s (%h)' "$EVENT_BEFORE..$GITHUB_SHA")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="build-${GITHUB_SHA::12}"
            NOTES=$(git log -1 --format='- %s (%h)' "$GITHUB_SHA")
          else
            VERSION="build-${GITHUB_SHA::12}"
            NOTES="- Initial image build (${GITHUB_SHA::12})"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="- Container image updated (${GITHUB_SHA::12})"
          fi
          BUILD_VERSION="$VERSION" BUILD_REVISION="$GITHUB_SHA" RELEASE_NOTES="$NOTES" python3 - <<'PY'
          import json, os
          with open('build-info.json', 'w', encoding='utf-8') as output:
              json.dump({
                  'version': os.environ['BUILD_VERSION'],
                  'revision': os.environ['BUILD_REVISION'],
                  'notes': os.environ['RELEASE_NOTES'],
              }, output, ensure_ascii=False, indent=2)
              output.write('\n')
          PY

      - name: Set up Python for Camoufox resolution
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.1"

      - name: Resolve latest Camoufox release
        id: camoufox
        run: |
          python -m pip install --quiet packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          import urllib.request
          from packaging.version import InvalidVersion, Version

          request = urllib.request.Request(
              "https://pypi.org/pypi/camoufox/json",
              headers={"User-Agent": "solverr-camoufox-resolver"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.load(response)["releases"]

          candidates = []
          for raw_version, files in releases.items():
              try:
                  version = Version(raw_version)
              except InvalidVersion:
                  continue
              if files and not all(file.get("yanked", False) for file in files):
                  candidates.append(version)

          if not candidates:
              raise SystemExit("PyPI did not report an installable Camoufox release")

          version = str(max(candidates))
          print(f"version={version}")
          print(f"Resolved latest Camoufox release: {version}", file=sys.stderr)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Push only a candidate tag; release tags are updated after validation.
      - name: Build candidate image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: &candidate-build
          context: .
          file: ./Dockerfile
          build-args: |
            CAMOUFOX_VERSION=${{ steps.camoufox.outputs.version }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Wait before retrying candidate build
        if: steps.build.outcome == 'failure'
        run: sleep 15

      - name: Retry candidate image build
        id: build-retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: *candidate-build

      - name: Select exact image for validation
        id: candidate
        env:
          LOCAL_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outcome == 'success' && steps.build.outputs.digest || steps.build-retry.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test -n "$DIGEST"
            echo "ref=$REGISTRY/$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$LOCAL_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test the built image
        run: |
          docker run --rm --entrypoint sh "${{ steps.candidate.outputs.ref }}" \
            -c '. /etc/os-release; test "$VERSION_CODENAME" = trixie'
          docker run -d --name solverr-smoke -p 8191:8191 "${{ steps.candidate.outputs.ref }}"
          echo "Waiting for /health to report ok..."
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8191/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "Health check passed:"; cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass in time. Container logs:"
          docker logs solverr-smoke
          exit 1

      - name: Tear down smoke test container
        if: always()
        run: docker rm -f solverr-smoke || true

      - name: Smoke test Camoufox as UGREEN UID/GID
        run: |
          docker run -d --name solverr-nonroot --shm-size=1g -p 8191:8191 \
            -e PUID=1000 -e PGID=10 \
            "${{ steps.candidate.outputs.ref }}"
          for i in $(seq 1 30); do
            curl -fs http://localhost:8191/health >/dev/null && break
            sleep 2
          done
          status="$(curl -sS --max-time 60 -o /tmp/solverr-browser.json -w '%{http_code}' http://localhost:8191/api/diagnostics/browser)"
          cat /tmp/solverr-browser.json
          if [ "$status" != "200" ]; then
            docker logs solverr-nonroot
            exit 1
          fi

      - name: Tear down non-root smoke test container
        if: always()
        run: docker rm -f solverr-nonroot || true

      - name: Scan image for vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Promote validated image to release tags
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$SOURCE"
          done <<< "$RELEASE_TAGS"

      - name: Record validated image and rollback references
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Validated Docker image'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $SOURCE"
            echo 'Use the digest to restore this exact image; commit tags can move on reruns.'
            echo '```text'
            echo "$RELEASE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          mode: COMMIT
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Other changes", "labels": [] }
              ],
              "label_extractor": [
                { "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)", "on_property": "title", "target": "$1" }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release if one does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$RELEASE_CHANGELOG"
          fi
