name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*.*", "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/

      - name: Security scan (bandit, non-blocking)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app -ll

  build-and-push:
    name: Build & Push Docker Image (amd64 / UGREEN NASync)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build exactly once, to a disposable staging tag, and both load it
      # locally (for the smoke test / trivy scan below) and push it (so the
      # later promotion step can retag it by digest without rebuilding).
      # Building a second time for the real push - as this workflow used to
      # do - gave no guarantee the pushed image matched what was validated:
      # the floating python base tag and the `>=` pins in requirements.txt
      # mean a second `docker buildx build` invocation can resolve different
      # package/base versions than the first, even with layer caching.
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test the built image
        run: |
          docker run -d --name solverr-smoke -p 8191:8191 "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}"
          echo "Waiting for /health to report ok..."
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8191/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "Health check passed:"; cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass in time. Container logs:"
          docker logs solverr-smoke
          exit 1

      - name: Tear down smoke test container
        if: always()
        run: docker rm -f solverr-smoke || true

      - name: Scan image for vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # Everything above validated the exact digest built above. Promote
      # that same digest to the real tags (latest/branch/semver/short-sha)
      # via imagetools - a registry-side retag, not a rebuild - so what
      # gets those tags is guaranteed byte-identical to what was scanned.
      - name: Promote validated image to release tags
        run: |
          set -eu
          digest="${{ steps.build.outputs.digest }}"
          source="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$source"
          done <<< "${{ steps.meta.outputs.tags }}"
