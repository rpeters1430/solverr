name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*.*", "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Lint (ruff)
        run: |
          ruff check app/

      - name: Security scan (bandit, non-blocking)
        continue-on-error: true
        run: |
          bandit -r app -ll

  build-and-push:
    name: Build & Push Docker Image (amd64 / UGREEN NASync)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Push only a candidate tag; release tags are updated after validation.
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Select exact image for validation
        id: candidate
        env:
          LOCAL_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test -n "$DIGEST"
            echo "ref=$REGISTRY/$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$LOCAL_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test the built image
        run: |
          docker run --rm --entrypoint sh "${{ steps.candidate.outputs.ref }}" \
            -c '. /etc/os-release; test "$VERSION_CODENAME" = trixie'
          docker run -d --name solverr-smoke -p 8191:8191 "${{ steps.candidate.outputs.ref }}"
          echo "Waiting for /health to report ok..."
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8191/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "Health check passed:"; cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass in time. Container logs:"
          docker logs solverr-smoke
          exit 1

      - name: Tear down smoke test container
        if: always()
        run: docker rm -f solverr-smoke || true

      - name: Smoke test Camoufox as UGREEN UID/GID
        run: |
          docker run -d --name solverr-nonroot --shm-size=1g -p 8191:8191 \
            -e PUID=1000 -e PGID=10 \
            "${{ steps.candidate.outputs.ref }}"
          for i in $(seq 1 30); do
            curl -fs http://localhost:8191/health >/dev/null && break
            sleep 2
          done
          status="$(curl -sS --max-time 60 -o /tmp/solverr-browser.json -w '%{http_code}' http://localhost:8191/api/diagnostics/browser)"
          cat /tmp/solverr-browser.json
          if [ "$status" != "200" ]; then
            docker logs solverr-nonroot
            exit 1
          fi

      - name: Tear down non-root smoke test container
        if: always()
        run: docker rm -f solverr-nonroot || true

      - name: Scan image for vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Promote validated image to release tags
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$SOURCE"
          done <<< "$RELEASE_TAGS"

      - name: Record validated image and rollback references
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Validated Docker image'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $SOURCE"
            echo 'Keep the digest or commit tag to restore this exact image.'
            echo '```text'
            echo "$RELEASE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
