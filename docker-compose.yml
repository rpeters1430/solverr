services:
  solverr:
    image: ghcr.io/rpeters1430/solverr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    shm_size: '2gb' # Recommended 1gb-2gb for Camoufox multi-worker rendering
    security_opt:
      - no-new-privileges:true
    # Mount ephemeral browser scratchpad into RAM (tmpfs) to eliminate SSD write wear
    # and prevent spinning HDDs from spinning up during solves on NAS deployments.
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /app/.cache/camoufox/tmp:size=512M,mode=1777
    # cap_drop: [ALL] is intentionally NOT enabled by default here: verified
    # working when the container runs as root (the default, no PUID/PGID),
    # but Camoufox's Firefox sandbox hangs indefinitely under cap_drop:ALL
    # once PUID/PGID drop the process to a non-root user via gosu, even with
    # CHOWN/SETUID/SETGID/SYS_CHROOT/SYS_ADMIN added back - tested directly
    # against this image. Only uncomment if you are NOT using PUID/PGID:
    # cap_drop:
    #   - ALL
    environment:
      - PORT=8191
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - MAX_BROWSER_WORKERS=auto # Auto-scales across CPU cores, clamped to 2-3 workers in NAS mode
      - NAS_MODE=true            # Conservative worker budgeting for UGREEN NASync / Synology / Unraid
      - HEADLESS=true
      - ENABLE_FAST_TLS=true
      - COOKIE_CACHE_TTL=7200
      # - PUID=1000                      # Optional: run as this user ID (must be set with PGID)
      # - PGID=1000                      # Optional: run as this group ID (must be set with PUID)
      # - TZ=Etc/UTC
      # - REDIS_URL=redis://redis:6379/0  # Shared cookie cache for horizontal scaling (see profile below)
      # - API_KEY=change-me                # Optional API key authentication for all endpoints
      # - CAPTCHA_SOLVER_API_KEY=          # Optional 2Captcha/CapSolver key for paid image challenge escalation
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional shared Redis cache for multi-replica horizontal scaling
  # Run with: docker compose --profile distributed up -d --scale solverr=3
  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: solverr-redis
    restart: unless-stopped
    profiles: ["distributed"]
    volumes:
      - solverr_redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  solverr_redis_data:
