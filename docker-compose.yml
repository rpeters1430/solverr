services:
  solverr:
    image: ghcr.io/rpeters1430/solverr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    shm_size: '2gb' # Recommended 1gb-2gb for Camoufox multi-worker rendering
    security_opt:
      - no-new-privileges:true
    # Browser scratch in RAM: no SSD wear and no HDD spin-ups on a NAS.
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /app/.cache/camoufox/tmp:size=512M,mode=1777
    # Works as root, but Camoufox hangs under cap_drop: ALL with PUID/PGID. Uncomment only without PUID/PGID:
    # cap_drop:
    #   - ALL
    environment:
      - PORT=8191
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - MAX_BROWSER_WORKERS=auto # Scales with CPU cores and RAM; capped at 2 in NAS mode
      - NAS_MODE=true            # Conservative worker budgeting for UGREEN NASync / Synology / Unraid
      - HEADLESS=true
      - ENABLE_FAST_TLS=true
      - COOKIE_CACHE_TTL=7200
      # - PUID=1000                      # Optional: run as this user ID (must be set with PGID)
      # - PGID=1000                      # Optional: run as this group ID (must be set with PUID)
      # - TZ=Etc/UTC
      # - REDIS_URL=redis://redis:6379/0  # Shared cookie cache for horizontal scaling (see profile below)
      # - API_KEY=change-me                # Optional API key authentication for all endpoints
      # - CAPTCHA_SOLVER_API_KEY=          # Optional 2Captcha/CapSolver key for paid image challenge escalation
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional shared Redis cache for multi-replica horizontal scaling
  # Run with: docker compose --profile distributed up -d --scale solverr=3
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: solverr-redis
    restart: unless-stopped
    profiles: ["distributed"]
    volumes:
      - solverr_redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  solverr_redis_data:
