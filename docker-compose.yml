services:
  solverr:
    image: ghcr.io/rpeters1430/solverr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solverr
    restart: unless-stopped
    ports:
      - "8191:8191"
      # Keep the proxy on host loopback by default. Same-network containers use http://solverr:8192.
      # Set MITM_BIND_IP to the NAS LAN address only when separate LAN clients need access.
      - "${MITM_BIND_IP:-127.0.0.1}:${MITM_PORT:-8192}:${MITM_PORT:-8192}"
    shm_size: '2gb' # Recommended 1gb-2gb for Camoufox multi-worker rendering
    security_opt:
      - no-new-privileges:true
    # Browser scratch in RAM: no SSD wear and no HDD spin-ups on a NAS.
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /app/.cache/camoufox/tmp:size=512M,mode=1777
    # Works as root, but Camoufox hangs under cap_drop: ALL with PUID/PGID. Uncomment only without PUID/PGID:
    # cap_drop:
    #   - ALL
    environment:
      - PORT=8191
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - MAX_BROWSER_WORKERS=auto # Scales with CPU cores and RAM; capped at 1 in NAS mode
      - NAS_MODE=true            # Conservative worker budgeting for UGREEN NASync / Synology / Unraid
      - HEADLESS=true
      - ENABLE_FAST_TLS=true
      - COOKIE_CACHE_TTL=7200
      - MITM_ENABLED=${MITM_ENABLED:-false}
      - MITM_HOST=0.0.0.0
      - MITM_PORT=${MITM_PORT:-8192}
      - MITM_CA_DIR=/app/data/proxy-ca
      - MITM_PROXY_USERNAME=${MITM_PROXY_USERNAME:-}
      - MITM_PROXY_PASSWORD=${MITM_PROXY_PASSWORD:-}
      # - PUID=1000                      # Optional: run as this user ID (must be set with PGID)
      # - PGID=1000                      # Optional: run as this group ID (must be set with PUID)
      # - TZ=Etc/UTC
      # - REDIS_URL=redis://redis:6379/0  # Shared cookie cache for horizontal scaling (see profile below)
      # - API_KEY=change-me                # Optional API key authentication for all endpoints
      # - CAPTCHA_SOLVER_API_KEY=          # Optional 2Captcha/CapSolver key for paid image challenge escalation
      # - CAMOUFOX_POOL_IDLE_TIMEOUT_SECONDS=120  # Optional: close warm browsers unused this long (default: 120s in NAS mode)
      # - FOLLOW_META_REFRESH=true         # Optional: follow short-delay <meta http-equiv="refresh"> redirects
      # - 'USER_PREFS={"network.dns.blockDotOnion": false}'  # Optional extra Firefox prefs (JSON)
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional shared Redis cache for multi-replica horizontal scaling
  # Run with: docker compose --profile distributed up -d --scale solverr=3
  redis:
    image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
    container_name: solverr-redis
    restart: unless-stopped
    profiles: ["distributed"]
    volumes:
      - solverr_redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  solverr_redis_data:
